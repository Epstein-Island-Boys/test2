<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Opener</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <button onclick="openTabs()">Open 5 Tabs</button>

    <script>
        function openTabs() {
            const searchUrl = 'https://www.google.com/search?q=unblocked';
            for (let i = 0; i < 5; i++) {
                window.open(searchUrl, '_blank');
            }
        }
    </script>

</body>
</html>
